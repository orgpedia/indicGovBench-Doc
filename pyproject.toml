[project]
name = "indic-gov-bench-doc"
version = "0.1.0"
description = "A benchmark for Indian government document processing, layout analysis, and understanding"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mukund", email = "mukund@example.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "docling>=2.0.0",
    "pypdfium2>=4.0.0",
    "pydantic>=2.0.0",
    "google-cloud-vision>=3.0.0",
    "google-genai>=2.12.1",
    "datalab-python-sdk>=0.5.0",
    "huggingface-hub>=0.24.0",
    "datasets>=2.19.0",
    "pyarrow>=14.0.0",
    "sarvamai>=0.1.30",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "modal>=1.5.2",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "markdown>=3.6",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
indic-bench = "indic_gov_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indic_gov_bench"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
